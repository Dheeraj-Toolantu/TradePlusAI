name: Day trader skills

on:
  push:
    paths:
      - ".claude/skills/trader-*/**"
      - "tests/day-trader-skill/**"
      - ".github/workflows/trader-skills.yml"
  pull_request:
    paths:
      - ".claude/skills/trader-*/**"
      - "tests/day-trader-skill/**"
      - ".github/workflows/trader-skills.yml"

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests/day-trader-skill -v
